<!-- Header -->
<div style="background:linear-gradient(135deg,#1A1A2E,#EC4899);padding:2.5rem 0 5rem">
  <div class="container">
    <h1 style="color:#fff;font-size:1.75rem;font-weight:800;margin-bottom:.25rem">
      <i class="bi bi-heart-fill me-2"></i>My Wishlist
    </h1>
    <p style="color:rgba(255,255,255,.7);margin:0;font-size:.9rem">Items you saved for later</p>
  </div>
</div>

<div class="container" style="max-width:860px;margin-top:-3rem;padding-bottom:3rem">

  <!-- Empty -->
  <div *ngIf="items.length === 0" class="card p-5 text-center fade-in-up">
    <div style="font-size:4rem;color:#F9A8D4;margin-bottom:1rem"><i class="bi bi-heart"></i></div>
    <h4 class="fw-800 mb-2">Your wishlist is empty</h4>
    <p class="text-muted mb-4">Browse products and click the heart icon to save them here.</p>
    <button class="btn btn-primary px-5" (click)="shopNow()">
      <i class="bi bi-bag me-2"></i>Shop Now
    </button>
  </div>

  <!-- Items -->
  <div *ngIf="items.length > 0" class="fade-in-up">

    <!-- Header bar -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="text-muted small">{{ items.length }} item{{ items.length !== 1 ? 's' : '' }} saved</span>
      <button class="btn btn-link btn-sm text-danger p-0" (click)="clearAll()">
        <i class="bi bi-trash me-1"></i>Clear all
      </button>
    </div>

    <div class="row g-3">
      <div class="col-sm-6 col-md-4" *ngFor="let item of items">
        <div class="card h-100">
          <!-- Image -->
          <div style="height:180px;overflow:hidden;border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:#F8F7FF;display:flex;align-items:center;justify-content:center;position:relative">
            <img *ngIf="item.imageUrl" [src]="item.imageUrl" [alt]="item.name"
                 style="width:100%;height:100%;object-fit:contain;padding:4px">
            <i *ngIf="!item.imageUrl" class="bi bi-image" style="font-size:2.5rem;color:#D1D5DB"></i>
            <!-- Remove heart -->
            <button (click)="remove(item)"
                    style="position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer;color:#EC4899">
              <i class="bi bi-heart-fill"></i>
            </button>
          </div>

          <div class="p-3 d-flex flex-column flex-grow-1">
            <div *ngIf="item.category" class="badge mb-2" style="background:#FCE7F3;color:#BE185D;width:fit-content">{{ item.category }}</div>
            <h6 class="fw-700 mb-1" style="font-size:.9rem;line-height:1.3">{{ item.name }}</h6>
            <div class="text-muted small mb-2">by {{ item.sellerName }}</div>
            <div class="fw-800 mt-auto mb-3" style="color:var(--color-primary);font-size:1rem">${{ item.price | number:'1.2-2' }}</div>
            <button class="btn btn-primary btn-sm w-100" (click)="moveToCart(item)">
              <i class="bi bi-cart-plus me-1"></i>Move to Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
