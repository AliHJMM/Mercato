events {
    worker_connections 1024;
}

http {
    # ── Docker embedded DNS — re-resolves upstream IPs on every TTL cycle ─────
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Security headers applied to all responses ─────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # ── Redirect plain HTTP → HTTPS ───────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS entry point ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/ssl/certs/buy01.crt;
        ssl_certificate_key /etc/ssl/private/buy01.key;

        # Modern TLS only
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Allow file uploads up to 3 MB (media service limit is 2 MB)
        client_max_body_size 3M;

        # Use a variable so nginx re-resolves the hostname via Docker DNS
        # instead of caching the IP at startup — prevents 502 after rebuilds
        set $frontend_upstream http://frontend:80;

        location / {
            proxy_pass         $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
